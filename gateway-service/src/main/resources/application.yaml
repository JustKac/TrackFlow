quarkus:
  application:
    name: gateway-service

  http:
    host: ${HTTP_HOST:0.0.0.0}
    port: ${HTTP_PORT:8080}

  banner:
    enabled: false

  log:
    level: INFO
    console:
      json: ${LOG_JSON:false}

kafka:
  bootstrap:
    servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

"%dev":
  quarkus:
    log:
      level: DEBUG

"%test":
  quarkus:
    log:
      level: INFO

"%prod":
  quarkus:
    log:
      level: INFO
    console:
      json: true

  kafka:
    bootstrap:
      servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}