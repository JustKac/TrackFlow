quarkus:
  application:
    name: gateway-service

  http:
    host: ${HTTP_HOST:0.0.0.0}
    port: ${HTTP_PORT:8080}

  banner:
    enabled: false

  log:
    level: INFO
    console:
      json: ${LOG_JSON:false}

  smallrye-openapi:
    path: /openapi

  otel:
    enabled: true
    resource:
      attributes: service.name=gateway-service
    exporter:
      otlp:
        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
        protocol: ${OTEL_EXPORTER_OTLP_PROTOCOL:grpc}
    traces:
      sampler: ${OTEL_TRACES_SAMPLER:parentbased_always_on}

kafka:
  bootstrap:
    servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

"%dev":
  quarkus:
    log:
      level: DEBUG

"%test":
  quarkus:
    log:
      level: INFO

"%prod":
  quarkus:
    log:
      level: INFO
      console:
        json: true
    smallrye-openapi:
      path: /openapi
    otel:
      enabled: true
      resource:
        attributes: service.name=gateway-service
      exporter:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}
          protocol: ${OTEL_EXPORTER_OTLP_PROTOCOL:grpc}
      traces:
        sampler: ${OTEL_TRACES_SAMPLER:parentbased_always_on}

  kafka:
    bootstrap:
      servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}